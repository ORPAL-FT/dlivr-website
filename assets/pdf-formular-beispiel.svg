<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="title desc"><title id="title">Beispiel eines strukturierten PDF-Formulars</title><desc id="desc">Drei klar beschriftete Eingabefelder für Vorgangsnummer, Datum und Tätigkeit. Die Inhalte sind fiktiv.</desc><rect width="640" height="350" rx="12" fill="#fff"/><g font-family="Arial, sans-serif"><text x="28" y="38" font-size="13" fill="#99482b" letter-spacing="2">FORMULARBEISPIEL</text><text x="28" y="73" font-size="25" font-weight="700" fill="#25282e">Vorgang dokumentieren</text><g font-size="16" fill="#25282e"><text x="28" y="115">Vorgangsnummer</text><text x="338" y="115">Datum</text></g><g fill="#f4f2ef" stroke="#99482b"><rect x="28" y="128" width="280" height="48" rx="6"/><rect x="338" y="128" width="274" height="48" rx="6"/><rect x="28" y="218" width="584" height="80" rx="6"/></g><g font-size="18" fill="#25282e"><text x="42" y="159">MUSTER-001</text><text x="352" y="159">17.09.2026</text><text x="28" y="205" font-size="16">Tätigkeit</text><text x="42" y="250">Unterlagen geprüft und ergänzt.</text></g><text x="28" y="328" font-size="13" fill="#62646a">Illustration · Felder und Inhalte werden individuell abgestimmt.</text></g></svg>